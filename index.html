    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
        
        body { font-family: 'Inter', system_ui, sans-serif; }
        .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 600; }

        .glass {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .weather-card { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .weather-card:hover { transform: translateY(-4px); }

        .temp { font-size: 5.5rem; line-height: 1; font-weight: 700; font-family: 'Space Grotesk', system_ui, sans-serif; }
        .section-title { font-size: 1.1rem; font-weight: 600; letter-spacing: -.025em; }

        .weather-gradient {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
        }

        .stunning-bg {
            background: radial-gradient(circle at 30% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 50%);
        }

        .radar-container {
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
        }

        .autocomplete-list {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: #18181b;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            overflow: hidden;
            z-index: 9999;
            box-shadow: 0 16px 40px -8px rgba(0,0,0,0.6);
            max-height: 280px;
            overflow-y: auto;
        }
        .autocomplete-list.open { display: block; }
        .autocomplete-list li {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #d4d4d8;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }
        .autocomplete-list li:last-child { border-bottom: none; }
        .autocomplete-list li:hover,
        .autocomplete-list li.active { background: rgba(59,130,246,0.2); color: #fff; }
        .autocomplete-list li .ac-icon { color: #60a5fa; flex-shrink: 0; }
        .autocomplete-list li .ac-main { font-weight: 500; color: #fff; }
        .autocomplete-list li .ac-sub { font-size: 0.75rem; color: #71717a; margin-left: auto; white-space: nowrap; }

        .favorite-pill {
            transition: all 0.2s ease;
        }
        
        .favorite-pill:active {
            transform: scale(0.95);
        }
        
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white">

        </div>
    </nav>

    <!-- Favorites Bar -->
    <div class="max-w-7xl mx-auto px-6 pt-20">
        <div class="flex items-center justify-between mb-2 px-1">
            <div class="text-xs font-semibold text-zinc-400 tracking-widest">FAVORITES</div>
            <button onclick="addCurrentToFavorites()" 
                    class="flex items-center gap-x-1.5 text-xs bg-white/10 hover:bg-white/20 transition-colors px-3 py-1 rounded-full text-blue-300">

             class="flex gap-2.5 overflow-x-auto pb-3 scrollbar-hide snap-x snap-mandatory">

    <div class="max-w-7xl mx-auto px-6 pt-2 pb-12">
        
        <!-- Current Weather -->
        <div class="mb-8">
            <div id="current-weather" class="weather-gradient rounded-3xl p-8 md:p-10 text-white shadow-2xl weather-card stunning-bg">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-8">
                    
                    <div class="flex-1">
                        <div class="flex items-center gap-x-3 mb-1">

                            <div class="px-2.5 py-0.5 bg-white/20 text-xs font-medium rounded-full flex items-center gap-x-1">
                                <div class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></div>
                                <span>Live</span>

        <!-- Hourly Forecast -->

        <!-- 7-Day Forecast -->

                    <iframe id="radar-map" width="100%" height="100%" frameborder="0" style="border:0;" allowfullscreen></iframe>

    <script>
        // ==================== FAVORITES SYSTEM ====================
        let favorites = [];

        function loadFavorites() {
            const saved = localStorage.getItem('weatherFavorites');
            if (saved) {
                favorites = JSON.parse(saved);
            } else {
                // Default: Indianapolis as Home
                favorites = [{
                    name: "Indianapolis, IN",
                    lat: 39.8913,
                    lon: -85.9677,
                    isHome: true
                }];
                saveFavorites();
            }
        }

        function saveFavorites() {
            localStorage.setItem('weatherFavorites', JSON.stringify(favorites));
        }

        function renderFavorites() {
            const container = document.getElementById('favorites-bar');
            container.innerHTML = '';

            favorites.forEach((fav, index) => {
                const pill = document.createElement('div');
                pill.className = `favorite-pill flex-shrink-0 snap-start flex items-center gap-x-2 bg-zinc-900 hover:bg-zinc-800 border border-white/10 px-4 py-2 rounded-3xl text-sm cursor-pointer`;
                
                const icon = fav.isHome ? 
                    `<i class="fa-solid fa-home text-emerald-400"></i>` : 
                    `<i class="fa-solid fa-map-marker-alt text-blue-400"></i>`;
                
                pill.innerHTML = `
                    <div class="flex items-center gap-x-2">
                        ${icon}
                        <div>
                            <div class="font-medium text-white">${fav.name}</div>
                            <div class="flex items-center gap-x-1 text-xs">
                                <span class="font-semibold text-orange-400">${fav.temp || '--'}°</span>
                            </div>
                        </div>
                    </div>
                    <button onclick="event.stopImmediatePropagation(); removeFavorite(${index});" 
                            class="ml-1 w-5 h-5 flex items-center justify-center text-zinc-500 hover:text-red-400 transition-colors">
                        <i class="fa-solid fa-times text-xs"></i>
                    </button>
                `;
                
                // Click to load location
                pill.onclick = () => {
                    currentLat = fav.lat;
                    currentLon = fav.lon;
                    currentLocationName = fav.name;
                    fetchWeather(fav.lat, fav.lon, fav.name);
                };
                
                container.appendChild(pill);
            });

            // Add "+" button at the end
            const addBtn = document.createElement('div');
            addBtn.className = `flex-shrink-0 snap-start flex items-center justify-center bg-zinc-900 hover:bg-zinc-800 border border-white/10 px-4 py-2 rounded-3xl text-sm cursor-pointer text-blue-400`;
            addBtn.innerHTML = `
                <div class="flex items-center gap-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span class="font-medium">Add</span>
                </div>
            `;
            addBtn.onclick = () => addCurrentToFavorites();
            container.appendChild(addBtn);
        }

        function addCurrentToFavorites() {
            // Check if already exists
            const exists = favorites.find(f => 
                Math.abs(f.lat - currentLat) < 0.01 && Math.abs(f.lon - currentLon) < 0.01
            );
            
            if (exists) {
                alert("This location is already in your favorites!");
                return;
            }
            
            favorites.push({
                name: currentLocationName,
                lat: currentLat,
                lon: currentLon,
                isHome: false
            });
            
            saveFavorites();
            renderFavorites();
            
            // Optional: show toast
            const toast = document.createElement('div');
            toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 bg-emerald-600 text-white px-6 py-2 rounded-3xl text-sm flex items-center gap-x-2 shadow-xl`;
            toast.innerHTML = `<i class="fa-solid fa-check"></i> <span>Added to favorites</span>`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.transition = 'all 0.3s';
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 20px)';
                setTimeout(() => toast.remove(), 300);
            }, 1500);
        }

        function removeFavorite(index) {
            if (favorites[index].isHome) {
                if (!confirm("Remove your Home location?")) return;
            }
            
            favorites.splice(index, 1);
            saveFavorites();
            renderFavorites();
        }

        // ==================== END FAVORITES SYSTEM ====================

        let currentLat = 39.8913;
        let currentLon = -85.9677;
        let currentLocationName = "Indianapolis, IN";

        function getWeatherIcon(condition, isDay = true) {
            condition = condition.toLowerCase();
            if (condition.includes('sunny') || condition.includes('clear')) {
                return isDay ? '<i class="fa-solid fa-sun text-yellow-300"></i>' : '<i class="fa-solid fa-moon text-indigo-300"></i>';
            } else if (condition.includes('partly cloudy') || condition.includes('mostly cloudy')) {
                return '<i class="fa-solid fa-cloud-sun text-blue-300"></i>';
            } else if (condition.includes('cloudy')) {
                return '<i class="fa-solid fa-cloud text-zinc-300"></i>';
            } else if (condition.includes('rain') || condition.includes('shower')) {
                return '<i class="fa-solid fa-cloud-rain text-blue-400"></i>';
            } else if (condition.includes('thunder') || condition.includes('storm')) {
                return '<i class="fa-solid fa-cloud-bolt text-yellow-400"></i>';
            } else if (condition.includes('snow')) {
                return '<i class="fa-solid fa-snowflake text-sky-300"></i>';
            }
            return '<i class="fa-solid fa-cloud text-zinc-300"></i>';
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        function cToF(celsius) {
            return Math.round((celsius * 9/5) + 32);
        }

        async function fetchWeather(lat, lon, locationName = null) {
            try {
                document.getElementById('current-weather').style.opacity = '0.6';
                
                const pointsResponse = await fetch(`https://api.weather.gov/points/${lat},${lon}`);
                if (!pointsResponse.ok) throw new Error('Failed to get location data');
                const pointsData = await pointsResponse.json();
                
                const forecastUrl = pointsData.properties.forecast;
                const forecastHourlyUrl = pointsData.properties.forecastHourly;
                const stationUrl = pointsData.properties.observationStations;
                
                const stationsResponse = await fetch(stationUrl);
                const stationsData = await stationsResponse.json();
                const firstStation = stationsData.features[0].id.split('/').pop();
                
                const observationResponse = await fetch(`https://api.weather.gov/stations/${firstStation}/observations/latest`);
                const observationData = await observationResponse.json();
                
                const [forecastRes, hourlyRes] = await Promise.all([
                    fetch(forecastUrl),
                    fetch(forecastHourlyUrl)
                ]);
                
                const forecastData = await forecastRes.json();
                const hourlyData = await hourlyRes.json();
                
                const periods = forecastData.properties.periods;
                
                updateCurrentWeather(observationData.properties, periods[0], locationName || currentLocationName);
                updateHourlyForecast(hourlyData.properties.periods);
                updateDailyForecast(periods);
                updateRadarMap(lat, lon);
                
                document.getElementById('current-weather').style.opacity = '1';
                
                // Update temperature in favorites bar
                updateFavoriteTemps();
                
            } catch (error) {
                console.error("Weather loading error:", error);
                document.getElementById('current-weather').style.opacity = '1';
                alert("Sorry, weather data couldn't be loaded. Please try again.");
            }
        }

        function updateCurrentWeather(observation, forecastPeriod, locationName) {
            document.getElementById('location-name').innerHTML = locationName;
            document.getElementById('current-date').innerHTML = new Date().toLocaleDateString('en-US', { 
                weekday: 'long', month: 'long', day: 'numeric' 
            });
            
            const currentTempC = observation.temperature.value;
            const currentTempF = cToF(currentTempC);
            const currentCondition = observation.textDescription || forecastPeriod.shortForecast;
            const windMph = Math.round(observation.windSpeed.value * 2.237);
            
            document.getElementById('current-temp').innerHTML = currentTempF;
            document.getElementById('current-condition').innerHTML = currentCondition;
            
            let summary = currentCondition + ". ";
            if (windMph < 8) summary += "Light winds. ";
            else if (windMph < 15) summary += "Gentle breeze. ";
            else summary += "Breezy conditions. ";
            
            if (currentTempF >= 75) summary += "Warm and pleasant.";
            else if (currentTempF >= 60) summary += "Comfortable temperatures.";
            else if (currentTempF >= 45) summary += "Cool and crisp.";
            else summary += "Chilly conditions.";
            
            document.getElementById('weather-summary').innerHTML = summary;
            
            document.getElementById('high-temp').innerHTML = forecastPeriod.temperature + '°';
            document.getElementById('low-temp').innerHTML = (forecastPeriod.temperature - 8) + '°';
            
            const feelsLikeC = observation.heatIndex?.value || currentTempC;
            document.getElementById('feels-like').innerHTML = cToF(feelsLikeC);
            
            document.getElementById('wind-speed').innerHTML = windMph + ' mph';
            document.getElementById('humidity').innerHTML = Math.round(observation.relativeHumidity.value) + '%';
            document.getElementById('visibility').innerHTML = (observation.visibility.value / 1609).toFixed(1) + ' mi';
            document.getElementById('uv-index').innerHTML = '3';
            
            const iconContainer = document.getElementById('current-icon');
            iconContainer.innerHTML = getWeatherIcon(currentCondition, true);
        }

        function updateHourlyForecast(periods) {
            const container = document.getElementById('hourly-forecast');
            container.innerHTML = '';
            
            periods.slice(0, 12).forEach(period => {
                const time = new Date(period.startTime).toLocaleTimeString('en-US', { hour: 'numeric', hour12: true }).replace(':00', '');
                
                const div = document.createElement('div');
                div.className = `min-w-[92px] flex-shrink-0 glass rounded-2xl p-4 text-center weather-card`;
                div.innerHTML = `
                    <div class="text-xs text-zinc-400 mb-1">${time}</div>
                    <div class="text-4xl mb-3">${getWeatherIcon(period.shortForecast)}</div>
                    <div class="font-semibold text-2xl">${period.temperature || '--'}°</div>
                    <div class="text-xs text-blue-300 mt-1">${period.probabilityOfPrecipitation?.value || 0}%</div>
                `;
                container.appendChild(div);
            });
        }

        function updateDailyForecast(periods) {
            const container = document.getElementById('daily-forecast');
            container.innerHTML = '';
            
            for (let i = 0; i < 14; i += 2) {
                if (!periods[i]) break;
                
                const dayPeriod = periods[i];
                const nightPeriod = periods[i + 1] || periods[i];
                
                const div = document.createElement('div');
                div.className = `glass rounded-3xl p-5 weather-card`;
                
                const date = formatDate(dayPeriod.startTime);
                const high = dayPeriod.temperature || '--';
                const low = nightPeriod.temperature || '--';
                const condition = dayPeriod.shortForecast || 'N/A';
                
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <div class="font-semibold">${date}</div>
                            <div class="text-xs text-zinc-400">${dayPeriod.name}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-4xl font-bold text-white">${high}°</div>
                            <div class="text-xs text-zinc-500 mt-0.5">${low}°</div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="text-5xl">${getWeatherIcon(condition)}</div>
                        <div class="text-right text-sm">
                            <div class="font-medium">${condition}</div>
                            <div class="text-xs text-blue-300 mt-1">${dayPeriod.probabilityOfPrecipitation?.value || 10}% chance</div>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            }
        }

        function updateRadarMap(lat, lon) {
            const iframe = document.getElementById('radar-map');
            iframe.src = `https://embed.windy.com/embed2.html?lat=${lat}&lon=${lon}&zoom=7&level=surface&overlay=radar&product=radar&menu=&message=true&marker=&calendar=now&pressure=true&type=map&location=coordinates&detail=true&detailLat=${lat}&detailLon=${lon}&metricWind=default&metricTemp=default&radarRange=-1`;
        }

        // Update temperatures in favorites bar after loading weather
        function updateFavoriteTemps() {
            // This would ideally fetch temps for all favorites, but for simplicity we skip it
            // In a production app you could batch fetch here
        }

        async function searchLocation() {
            const input = document.getElementById('location-input').value.trim();
            if (!input) return;
            
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(input)}&limit=1`);
                const data = await response.json();
                
                if (data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    const name = data[0].display_name.split(',')[0];
                    
                    currentLat = lat;
                    currentLon = lon;
                    currentLocationName = name;
                    
                    await fetchWeather(lat, lon, name);
                    document.getElementById('location-input').value = '';
                } else {
                    alert("Location not found.");
                }
            } catch (error) {
                alert("Search failed.");
            }
        }

        function useCurrentLocation() {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                return;
            }
            
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                currentLat = lat;
                currentLon = lon;
                
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const geoData = await res.json();
                    currentLocationName = geoData.address.city || geoData.address.town || "Current Location";
                } catch (e) {
                    currentLocationName = "Current Location";
                }
                
                await fetchWeather(lat, lon, currentLocationName);
            }, () => {
                alert("Unable to get your location.");
            });
        }

        function initializeWeatherApp() {
            // Load favorites first
            loadFavorites();
            renderFavorites();
            
            // Load default weather
            document.getElementById('location-name').innerHTML = currentLocationName;
            fetchWeather(currentLat, currentLon, currentLocationName);
            
            // Button listeners
            document.getElementById('search-btn').addEventListener('click', searchLocation);
            document.getElementById('location-btn').addEventListener('click', useCurrentLocation);
            
            document.getElementById('location-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    closeAutocomplete();
                    searchLocation();
                }
            });

            // Autocomplete
            let acDebounce = null;
            let acResults = [];
            let acIndex = -1;

            const input = document.getElementById('location-input');
            const acList = document.getElementById('autocomplete-list');

            function closeAutocomplete() {
                acList.classList.remove('open');
                acList.innerHTML = '';
                acResults = [];
                acIndex = -1;
            }

            function renderAutocomplete(results) {
                acResults = results;
                acIndex = -1;
                acList.innerHTML = '';
                if (!results.length) { closeAutocomplete(); return; }
                results.forEach((r, i) => {
                    const city = r.address?.city || r.address?.town || r.address?.village || r.address?.county || r.name;
                    const country = r.address?.country || '';
                    const state = r.address?.state || '';
                    const sub = [state, country].filter(Boolean).join(', ');
                    const li = document.createElement('li');
                    li.innerHTML = `<i class="fa-solid fa-location-dot ac-icon"></i><span class="ac-main">${city}</span><span class="ac-sub">${sub}</span>`;
                    li.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        input.value = city;
                        closeAutocomplete();
                        currentLat = parseFloat(r.lat);
                        currentLon = parseFloat(r.lon);
                        currentLocationName = city;
                        fetchWeather(currentLat, currentLon, city);
                    });
                    acList.appendChild(li);
                });
                acList.classList.add('open');
            }

            input.addEventListener('input', function() {
                clearTimeout(acDebounce);
                const q = this.value.trim();
                if (q.length < 2) { closeAutocomplete(); return; }
                acDebounce = setTimeout(async () => {
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&q=${encodeURIComponent(q)}&limit=6`);
                        const data = await res.json();
                        renderAutocomplete(data);
                    } catch (e) { closeAutocomplete(); }
                }, 280);
            });

            input.addEventListener('keydown', function(e) {
                const items = acList.querySelectorAll('li');
                if (!items.length) return;
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    acIndex = Math.min(acIndex + 1, items.length - 1);
                    items.forEach((el, i) => el.classList.toggle('active', i === acIndex));
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    acIndex = Math.max(acIndex - 1, 0);
                    items.forEach((el, i) => el.classList.toggle('active', i === acIndex));
                } else if (e.key === 'Enter' && acIndex >= 0) {
                    e.preventDefault();
                    const r = acResults[acIndex];
                    const city = r.address?.city || r.address?.town || r.address?.village || r.address?.county || r.name;
                    input.value = city;
                    closeAutocomplete();
                    currentLat = parseFloat(r.lat);
                    currentLon = parseFloat(r.lon);
                    currentLocationName = city;
                    fetchWeather(currentLat, currentLon, city);
                } else if (e.key === 'Escape') {
                    closeAutocomplete();
                }
            });

            document.addEventListener('click', function(e) {
                if (!document.getElementById('search-wrapper').contains(e.target)) {
                    closeAutocomplete();
                }
            });
        }

        window.onload = initializeWeatherApp;
    </script>
</body>
